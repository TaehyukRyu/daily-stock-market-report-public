<text class="sans t-muted" x="92" y="210" font-size="12" text-anchor="middle">110종목</text>
<rect class="card" x="184" y="160" width="120" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="244" y="190" font-size="16" font-weight="600" text-anchor="middle">스크리닝</text>
<text class="sans t-muted" x="244" y="210" font-size="12" text-anchor="middle">뉴스 급증·공시</text>
<rect class="card" x="336" y="160" width="120" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="396" y="190" font-size="16" font-weight="600" text-anchor="middle">투표 8명</text>
<text class="sans t-muted" x="396" y="210" font-size="12" text-anchor="middle">LLM 7 + 규칙 1</text>
<rect class="mask" x="488" y="160" width="120" height="64" rx="6"/>
<rect class="focal" x="488" y="160" width="120" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="548" y="190" font-size="16" font-weight="600" text-anchor="middle">방향 결정</text>
<text class="mono t-muted" x="548" y="210" font-size="12" text-anchor="middle">decide()</text>
<rect class="card" x="640" y="160" width="120" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="700" y="190" font-size="16" font-weight="600" text-anchor="middle">chief 서술</text>
<text class="sans t-muted" x="700" y="210" font-size="12" text-anchor="middle">근거·리스크</text>
<rect class="mask" x="792" y="160" width="120" height="64" rx="6"/>
<rect class="ext" x="792" y="160" width="120" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="852" y="190" font-size="16" font-weight="600" text-anchor="middle">Notion</text>
<text class="sans t-muted" x="852" y="210" font-size="12" text-anchor="middle">하루 1건 발행</text>
<text class="sans t-muted" x="548" y="256" font-size="12" text-anchor="middle">표가 같으면 방향도 같다</text>
<line class="rule" x1="32" y1="280" x2="912" y2="280" stroke-width="0.8"/>
<line class="ln" x1="32" y1="300" x2="60" y2="300" stroke-width="1.2"/>
<text class="sans t-muted" x="68" y="304" font-size="12">매일</text>
<line class="ln-soft" x1="124" y1="300" x2="152" y2="300" stroke-width="1" stroke-dasharray="5,4"/>
<text class="sans t-muted" x="160" y="304" font-size="12">조건부</text>
<rect class="focal" x="228" y="292" width="20" height="14" rx="3" stroke-width="1"/>
<text class="sans t-muted" x="256" y="304" font-size="12">LLM이 아닌 코드</text>
</svg>
