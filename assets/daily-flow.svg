<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="944" height="320" viewBox="0 0 944 320" role="img" aria-labelledby="daily-flow-title daily-flow-desc">
<title id="daily-flow-title">하루 흐름</title>
<desc id="daily-flow-desc">유니버스 110종목을 뉴스·공시로 스크리닝하고, 투표자 8명의 표를 파이썬 규칙이 방향으로 확정한 뒤 chief가 근거를 서술해 Notion에 발행하는 흐름. 토론은 의견이 팽팽할 때만 열린다.</desc>
<defs>
<style>
.bg{fill:#f5f5f5} .mask{fill:#f5f5f5}
.card{fill:#ffffff;stroke:#2d3142}
.inp{fill:rgba(79,93,117,0.10);stroke:#7a8399}
.opt{fill:rgba(45,49,66,0.02);stroke:rgba(45,49,66,0.40);stroke-dasharray:4 3}
.ext{fill:rgba(45,49,66,0.03);stroke:rgba(45,49,66,0.30)}
.store{fill:rgba(45,49,66,0.05);stroke:#4f5d75}
.focal{fill:rgba(235,108,54,0.08);stroke:#eb6c36}
.hub{fill:#2d3142}
.ln{stroke:#4f5d75;fill:none} .ln-soft{stroke:#7a8399;fill:none} .ln-acc{stroke:#eb6c36;fill:none}
.m{fill:#4f5d75} .m-soft{fill:#7a8399} .m-acc{fill:#eb6c36}
.rule{stroke:rgba(45,49,66,0.12)}
.t-ink{fill:#2d3142} .t-muted{fill:#4f5d75} .t-soft{fill:#7a8399} .t-acc{fill:#d9591f} .t-hub{fill:#f5f5f5}
.dot{fill:#2d3142}
.sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif} .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.bg{fill:#2d3142} .mask{fill:#2d3142}
.card{fill:#393e53;stroke:#f5f5f5}
.inp{fill:rgba(191,192,192,0.10);stroke:#8e98ac}
.opt{fill:rgba(245,245,245,0.03);stroke:rgba(245,245,245,0.45)}
.ext{fill:rgba(245,245,245,0.04);stroke:rgba(245,245,245,0.35)}
.store{fill:rgba(245,245,245,0.06);stroke:#bfc0c0}
.focal{fill:rgba(240,138,89,0.10);stroke:#f08a59}
.hub{fill:#f5f5f5}
.ln{stroke:#bfc0c0} .ln-soft{stroke:#8e98ac} .ln-acc{stroke:#f08a59}
.m{fill:#bfc0c0} .m-soft{fill:#8e98ac} .m-acc{fill:#f08a59}
.rule{stroke:rgba(245,245,245,0.12)}
.t-ink{fill:#f5f5f5} .t-muted{fill:#bfc0c0} .t-soft{fill:#8e98ac} .t-acc{fill:#f08a59} .t-hub{fill:#2d3142}
.dot{fill:#f5f5f5}
}
</style>
<marker id="daily-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m" points="0 0, 8 3, 0 6"/></marker>
<marker id="daily-flow-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-soft" points="0 0, 8 3, 0 6"/></marker>
<marker id="daily-flow-arrow-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-acc" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="944" height="320" rx="8"/>
<text class="mono t-soft" x="32" y="36" font-size="12" letter-spacing="0.08em">EVERY WEEKDAY · GITHUB ACTIONS</text>
<path class="ln" d="M152,192 H182" stroke-width="1.2" marker-end="url(#daily-flow-arrow)"/>
<path class="ln" d="M304,192 H334" stroke-width="1.2" marker-end="url(#daily-flow-arrow)"/>
<path class="ln" d="M456,192 H486" stroke-width="1.2" marker-end="url(#daily-flow-arrow)"/>
<path class="ln" d="M608,192 H638" stroke-width="1.2" marker-end="url(#daily-flow-arrow)"/>
<path class="ln" d="M760,192 H790" stroke-width="1.2" marker-end="url(#daily-flow-arrow)"/>
<path class="ln-soft" d="M396,160 V96 Q396,88 404,88 H486" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#daily-flow-arrow-soft)"/>
<path class="ln-soft" d="M608,88 H692 Q700,88 700,96 V158" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#daily-flow-arrow-soft)"/>
<line class="ln-soft" x1="548" y1="228" x2="548" y2="240" stroke-width="1" stroke-dasharray="2,3"/>
<rect class="mask" x="488" y="56" width="120" height="64" rx="6"/>
