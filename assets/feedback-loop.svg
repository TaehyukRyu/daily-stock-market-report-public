<path class="ln" d="M264.000,558.274 A240,240 0 0 1 159.031,484.927" stroke-width="1.2" marker-end="url(#feedback-loop-arrow)"/>
<path class="ln" d="M120.715,420.000 A240,240 0 0 1 120.278,245.118" stroke-width="1.2" marker-end="url(#feedback-loop-arrow)"/>
<path class="ln" d="M158.269,180.000 A240,240 0 0 1 262.870,106.129" stroke-width="1.2" marker-end="url(#feedback-loop-arrow)"/>
<path class="ln-soft" d="M344.000,124.000 L344.000,274.000" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#feedback-loop-arrow-soft)"/>
<path class="ln-soft" d="M496.533,244.000 L439.330,277.002" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#feedback-loop-arrow-soft)"/>
<path class="ln-soft" d="M496.533,420.000 L439.330,386.998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#feedback-loop-arrow-soft)"/>
<path class="ln-soft" d="M191.467,420.000 L248.670,386.998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#feedback-loop-arrow-soft)"/>
<rect class="card" x="264" y="60" width="160" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="344" y="90" font-size="16" font-weight="600" text-anchor="middle">예측 기록</text>
<text class="sans t-muted" x="344" y="110" font-size="12" text-anchor="middle">D일 · 8명 + chief</text>
<rect class="card" x="472" y="180" width="160" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="552" y="210" font-size="16" font-weight="600" text-anchor="middle">D+1 복기</text>
<text class="sans t-muted" x="552" y="230" font-size="12" text-anchor="middle">교훈 2~4문장</text>
<rect class="card" x="472" y="420" width="160" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="552" y="450" font-size="16" font-weight="600" text-anchor="middle">D+5 채점</text>
<text class="sans t-muted" x="552" y="470" font-size="12" text-anchor="middle">실현 수익 기준</text>
<rect class="mask" x="264" y="540" width="160" height="64" rx="6"/>
<rect class="focal" x="264" y="540" width="160" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="344" y="570" font-size="16" font-weight="600" text-anchor="middle">증거 게이트</text>
<text class="sans t-muted" x="344" y="590" font-size="12" text-anchor="middle">30표본 + z검정</text>
<rect class="card" x="56" y="420" width="160" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="136" y="450" font-size="16" font-weight="600" text-anchor="middle">가중치 갱신</text>
<text class="sans t-muted" x="136" y="470" font-size="12" text-anchor="middle">통과할 때만</text>
<rect class="card" x="56" y="180" width="160" height="64" rx="6" stroke-width="1"/>
<text class="sans t-ink" x="136" y="210" font-size="16" font-weight="600" text-anchor="middle">다음 판단</text>
<text class="sans t-muted" x="136" y="230" font-size="12" text-anchor="middle">교훈·가중치 주입</text>
<rect class="hub" x="244" y="280" width="200" height="104" rx="8"/>
<text class="mono t-hub" x="344" y="330" font-size="16" font-weight="600" text-anchor="middle">mentions.db</text>
<text class="sans t-hub" x="344" y="352" font-size="12" text-anchor="middle" opacity="0.8">판단·채점 원장</text>
<line class="rule" x1="56" y1="624" x2="632" y2="624" stroke-width="0.8"/>
<line class="ln" x1="56" y1="644" x2="84" y2="644" stroke-width="1.2"/>
<text class="sans t-muted" x="92" y="648" font-size="12">매일 순서</text>
<line class="ln-soft" x1="180" y1="644" x2="208" y2="644" stroke-width="1" stroke-dasharray="5,4"/>
<text class="sans t-muted" x="216" y="648" font-size="12">DB에 기록</text>
<rect class="focal" x="308" y="636" width="20" height="14" rx="3" stroke-width="1"/>
<text class="sans t-muted" x="336" y="648" font-size="12">통과해야 다음으로</text>
</svg>
